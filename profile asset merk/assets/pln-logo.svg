<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- PLN Yellow Rounded Diamond / Rectangle -->
  <rect x="6" y="6" width="48" height="48" rx="8" fill="#FFD100" stroke="#00A3E0" stroke-width="2.5"/>
  
  <!-- Blue wave stripes in background -->
  <path d="M 12 36 Q 22 30 30 36 T 48 36" stroke="#00A3E0" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 12 42 Q 22 36 30 42 T 48 42" stroke="#00A3E0" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 12 48 Q 22 42 30 48 T 48 48" stroke="#00A3E0" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- PLN Red Lightning Bolt -->
  <polygon points="32,10 18,32 28,32 22,50 42,26 30,26" fill="#EE2726" stroke="#B91C1C" stroke-width="0.8"/>
  
  <!-- Text PLN -->
  <text x="64" y="31" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0A2540" letter-spacing="1">PLN</text>
  <!-- Text OPERASI SISTEM -->
  <text x="64" y="47" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#00A3E0" letter-spacing="1">OPERASI SISTEM</text>
</svg>
