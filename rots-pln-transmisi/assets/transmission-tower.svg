<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" opacity="0.35">
  <!-- Transmission Tower 1 (Center) -->
  <g stroke="#00A3E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Legs -->
    <line x1="80" y1="10" x2="60" y2="110"/>
    <line x1="80" y1="10" x2="100" y2="110"/>
    <!-- Cross beams -->
    <line x1="68" y1="35" x2="92" y2="35"/>
    <line x1="65" y1="55" x2="95" y2="55"/>
    <line x1="62" y1="80" x2="98" y2="80"/>
    <!-- Cross X -->
    <line x1="68" y1="35" x2="95" y2="55"/>
    <line x1="92" y1="35" x2="65" y2="55"/>
    <line x1="65" y1="55" x2="98" y2="80"/>
    <line x1="95" y1="55" x2="62" y2="80"/>
    <line x1="62" y1="80" x2="100" y2="110"/>
    <line x1="98" y1="80" x2="60" y2="110"/>
    <!-- Crossarms -->
    <line x1="50" y1="35" x2="110" y2="35"/>
    <line x1="45" y1="55" x2="115" y2="55"/>
    <line x1="40" y1="80" x2="120" y2="80"/>
    <!-- Insulators / Drops -->
    <line x1="50" y1="35" x2="50" y2="45"/>
    <line x1="110" y1="35" x2="110" y2="45"/>
    <line x1="45" y1="55" x2="45" y2="65"/>
    <line x1="115" y1="55" x2="115" y2="65"/>
    <line x1="40" y1="80" x2="40" y2="90"/>
    <line x1="120" y1="80" x2="120" y2="90"/>
    <!-- Top Peak -->
    <line x1="80" y1="5" x2="80" y2="10"/>
  </g>
  <!-- Power Transmission Lines -->
  <path d="M 0 50 Q 45 68 80 45 T 160 50" stroke="#00A3E0" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.4"/>
  <path d="M 0 70 Q 40 88 80 65 T 160 70" stroke="#00A3E0" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.4"/>
</svg>
